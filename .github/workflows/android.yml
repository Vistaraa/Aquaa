name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Provide sdkmanager and Android SDK tooling
    - name: Set up Android SDK (provides sdkmanager)
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components and accept licenses
      run: |
        # Install platform tools, the platform and build-tools your project needs.
        # Adjust API level / build-tools version to match your project (e.g. android-33 / 33.0.2).
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Generate Gradle Wrapper
      run: ./gradlew wrapper

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk